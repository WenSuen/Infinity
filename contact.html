<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Infinity Industrial Supplies</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="js/script.js" defer></script>
</head>
<body class="contact-page">
    
    <!-- Header Container -->
    <div class="header-container"></div>
    
    <!-- CTA Banner -->
    <section class="cta-banner">
        <p class="cta-main-text">🤝 We’re happy to assist you! Reach out today for expert advice on our products and services.</p>
        <a href="tel:+60193225830" class="cta-button call">
            <i class="fas fa-phone"></i>
            <span>Call Us</span>
            <div class="contact-info">+60193225830</div>
        </a>
        <a href="mailto:inflexinf@yahoo.com" class="cta-button email">
            <i class="fas fa-envelope"></i>
            <span>Email Us</span>
            <div class="contact-info">inflexinf@yahoo.com</div>
        </a>                     
    </section>              
    
    <!-- Footer Container -->
    <div class="footer-container"></div>

    <!-- Back to Top Button -->
    <button id="backToTop" title="Back to Top">
        <i class="fas fa-arrow-up"></i>
    </button>

    <!-- WhatsApp Button -->
    <div id="whatsappButton" class="whatsapp-button">
        <i class="fab fa-whatsapp"></i>
    </div>
    
    <script>
        // Load header and footer dynamically
        loadComponents();
    </script>
</body>
</html>
