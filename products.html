<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/products.css">
    <script src="js/script.js" defer></script>
</head>
<body class="products-page">
    <!-- Header Container -->
    <div class="header-container"></div>

    <!-- Main Container for Products -->
    <div class="products-container">
        <!-- Left Navigation Panel -->
        <aside class="product-navigation">
            <h2>Product Categories</h2>
            <ul>
                <li><a href="#net">Net</a></li>
                <li><a href="#tape">Tape</a></li>
                <li><a href="#mesh">Mesh</a></li>
                <li><a href="#frame">Frame</a></li>
                <li><a href="#accessories">Accessories</a></li>
                <li><a href="#clips">Clips</a></li>
            </ul>
        </aside>
    
        <!-- Product Display Section -->
        <section class="product-display">
            <header>
                <h1>Products</h1>
                <div class="sort-filter">
                    <label for="sort">Sort By:</label>
                    <select id="sort">
                        <option value="default">Default</option>
                        <option value="price">Price</option>
                        <option value="popularity">Popularity</option>
                    </select>
                    <label for="show">Show:</label>
                    <select id="show">
                        <option value="10">10</option>
                        <option value="15">15</option>
                        <option value="20">20</option>
                    </select>
                </div>
            </header>
    
            <!-- Product Sections -->
            <div id="net" class="product-section">
                <h2>Net</h2>
                <div class="product-grid"></div>
            </div>
            <div id="tape" class="product-section">
                <h2>Tape</h2>
                <div class="product-grid"></div>
            </div>
            <div id="mesh" class="product-section">
                <h2>Mesh</h2>
                <div class="product-grid"></div>
            </div>
            <div id="frame" class="product-section">
                <h2>Frame</h2>
                <div class="product-grid"></div>
            </div>
            <div id="accessories" class="product-section">
                <h2>Accessories</h2>
                <div class="product-grid"></div>
            </div>
            <div id="clips" class="product-section">
                <h2>Clips</h2>
                <div class="product-grid"></div>
            </div>
        </section>
    </div>    

    <!-- Product Details Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <!-- Modal content will be dynamically generated -->
        </div>
    </div>
    
    <!-- Footer Container -->
    <div class="footer-container"></div>

    <!-- Back to Top Button -->
    <button id="backToTop" title="Back to Top">
        <i class="fas fa-arrow-up"></i>
    </button>

    <!-- WhatsApp Button -->
    <div id="whatsappButton" class="whatsapp-button">
        <i class="fab fa-whatsapp"></i>
    </div>

    <script>
        // Initialize components on DOM load
        loadComponents();
        renderProducts();
    </script>
</body>
</html>
