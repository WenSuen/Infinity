<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/path-to-flaticon.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/products.css">
    <script src="js/script.js" defer></script>
</head>
<body class="products-page">
    <!-- Header Container -->
    <div class="header-container"></div>

    <!-- Main Container for Products -->
    <div class="products-container">
        <!-- Left Navigation Panel -->
        <aside class="product-navigation">
            <h2>Products</h2>
            <ul>
                <li><a href="#security-screens">Security Screens</a></li>
                <li><a href="#diy-screens">DIY Screens</a></li>
                <li><a href="#insect-screens">Insect Screens</a></li>
                <li><a href="#elegant-screens">Elegant Screens</a></li>
            </ul>
        </aside>

        <!-- Product Display Section -->
        <section class="product-display">
            <header>
                <h1>Products</h1>
                <div class="sort-filter">
                    <label for="sort">Sort By:</label>
                    <select id="sort">
                        <option value="default">Default</option>
                        <option value="price">Price</option>
                        <option value="popularity">Popularity</option>
                    </select>
                    <label for="show">Show:</label>
                    <select id="show">
                        <option value="10">10</option>
                        <option value="15">15</option>
                        <option value="20">20</option>
                    </select>
                </div>
            </header>

            <!-- Product Grid -->
            <div id="productGrid" class="product-grid">
                <!-- Dynamically Generated Product Cards will be inserted here by JavaScript -->
            </div>
        </section>
    </div>

    <!-- Product Details Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <!-- Modal content will be dynamically generated -->
        </div>
    </div>
    
    <!-- Footer Container -->
    <div class="footer-container"></div>

    <!-- Back to Top Button -->
    <button id="backToTop" title="Back to Top">
        <i class="fas fa-arrow-up"></i>
    </button>

    <!-- WhatsApp Button -->
    <div id="whatsappButton" class="whatsapp-button">
        <i class="fab fa-whatsapp"></i>
    </div>

    <script>
        // Call the function to load components dynamically
        loadComponents();

        // Modal Interaction Logic
        document.addEventListener("DOMContentLoaded", () => {
            const modal = document.getElementById("product-modal");
            const closeBtn = document.querySelector(".close");
            const viewDetailsBtns = document.querySelectorAll(".view-details");

            viewDetailsBtns.forEach((btn) => {
                btn.addEventListener("click", () => {
                    modal.style.display = "flex";
                });
            });

            closeBtn.addEventListener("click", () => {
                modal.style.display = "none";
            });

            window.addEventListener("click", (event) => {
                if (event.target === modal) {
                    modal.style.display = "none";
                }
            });
        });
    </script>
</body>
</html>
