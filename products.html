<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/path-to-flaticon.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="products.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <!-- Header Container -->
    <div class="header-container"></div>

    <!-- Main container for products -->
    <div class="products-container">
        <!-- Left Navigation Panel -->
        <aside class="product-navigation">
            <h2>Products</h2>
            <ul>
                <li><a href="#security-screens">Security Screens</a></li>
                <li><a href="#diy-screens">DIY Screens</a></li>
                <li><a href="#insect-screens">Insect Screens</a></li>
                <li><a href="#elegant-screens">Elegant Screens</a></li>
            </ul>
        </aside>

        <!-- Product Display Section -->
        <section class="product-display">
            <header>
                <h1>Products</h1>
                <div class="sort-filter">
                    <label for="sort">Sort By:</label>
                    <select id="sort">
                        <option value="default">Default</option>
                        <option value="price">Price</option>
                        <option value="popularity">Popularity</option>
                    </select>
                    <label for="show">Show:</label>
                    <select id="show">
                        <option value="10">10</option>
                        <option value="15">15</option>
                        <option value="20">20</option>
                    </select>
                </div>
            </header>

            <div class="product-grid">
                <div class="product-card">
                    <img src="images/product1.jpg" alt="Bi-Fold Door Screen">
                    <h3>Bi-Fold Door Screen</h3>
                    <button>Call for price</button>
                </div>
                <div class="product-card">
                    <img src="images/product2.jpg" alt="Clip On Screen">
                    <h3>Clip On Screen</h3>
                    <button>Call for price</button>
                </div>
                <div class="product-card">
                    <img src="images/product3.jpg" alt="Elegant Fold Type Screen">
                    <h3>Elegant Fold Type Screen</h3>
                    <button>Call for price</button>
                </div>
            </div>
        </section>
    </div>

    <!-- Footer Container -->
    <div class="footer-container"></div>

    <script>
        // Call the function to load components dynamically
        loadComponents();
    </script>
</body>
</html>
