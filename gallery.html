<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Infinity Industrial Supplies</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <script src="js/script.js" defer></script>
</head>
<body class="gallery-page">
    
    <!-- Header Container -->
    <div class="header-container"></div>
    
    <section class="gallery-section">
        <h2>Project Gallery</h2>

        <!-- Window Gallery -->
        <div class="gallery-category">
            <h3>Window Projects</h3>
            <div class="gallery-grid" id="windowGallery">
                <!-- Window images will be loaded dynamically -->
            </div>
        </div>

        <!-- Door Gallery -->
        <div class="gallery-category">
            <h3>Door Projects</h3>
            <div class="gallery-grid" id="doorGallery">
                <!-- Door images will be loaded dynamically -->
            </div>
        </div>
    </section>
    
    <!-- Lightbox for Fullscreen View -->
    <div id="lightbox" class="lightbox">
        <span class="close-lightbox">&times;</span>
        <img id="lightboxImg" class="lightbox-img" src="" alt="Gallery Image">
        <button id="prevImg" class="lightbox-nav">&lt;</button>
        <button id="nextImg" class="lightbox-nav">&gt;</button>
    </div>
    
    <!-- Footer Container -->
    <div class="footer-container"></div>

    <!-- Back to Top Button -->
    <button id="backToTop" title="Back to Top">
        <i class="fas fa-arrow-up"></i>
    </button>

    <!-- WhatsApp Button -->
    <div id="whatsappButton" class="whatsapp-button">
        <i class="fab fa-whatsapp"></i>
    </div>
    
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            await loadComponents(); // Ensure header and footer load before running scripts
            initializeGallery();
        });
    </script>
</body>
</html>
